name: Release

# This workflow runs only when a tag in the form vX.Y.Z is pushed.
# The filter must match the full tag name. Tags such as v1.2.3-rc1 do not match.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job needs write access to create the GitHub release.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The token is not stored in the local git configuration.
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XatOrchestrator.slnx

      - name: Build
        run: dotnet build XatOrchestrator.slnx --configuration Release --no-restore -p:Version="${TAG#v}"

      - name: Test
        run: dotnet test XatOrchestrator.slnx --configuration Release --no-build

      # The publish output includes the pipeline files and the prompt templates.
      - name: Publish the API
        run: >
          dotnet publish src/Xat.Orchestrator.Api/Xat.Orchestrator.Api.csproj
          --configuration Release
          --no-restore
          --output artifacts/publish
          -p:Version="${TAG#v}"

      - name: Create the archive
        run: |
          mkdir -p artifacts/release
          (cd artifacts/publish && zip -r "../release/xat-orchestrator-${TAG}.zip" .)

      # Only this step receives the token. The archive goes to the release, not to the run.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          "artifacts/release/xat-orchestrator-${TAG}.zip"
          --title "$TAG"
          --generate-notes
          --verify-tag
