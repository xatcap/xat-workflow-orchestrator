name: CI

# This workflow runs only for pull requests.
on:
  pull_request:

# Cancel the older run when a new commit arrives on the same pull request.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XatOrchestrator.slnx

      - name: Build
        run: dotnet build XatOrchestrator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test XatOrchestrator.slnx --configuration Release --no-build
